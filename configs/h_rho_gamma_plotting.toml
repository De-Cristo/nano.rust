[plotting]
default_profile = "physics_focus"
write_full_range_sanity = true
write_range_coverage = true
coverage_warning_threshold = 0.10

[plotting.profiles.full_range_sanity]
h_mass = { range = [0.0, 2000.0], bins = 100, overflow = true }
rho_mass = { range = [0.0, 10.0], bins = 100, overflow = true }
photon_pt = { range = [0.0, 1000.0], bins = 100, overflow = true }
rho_pt = { range = [0.0, 1000.0], bins = 100, overflow = true }
h_pt = { range = [0.0, 1000.0], bins = 100, overflow = true }
pi_plus_pt = { range = [0.0, 500.0], bins = 100, overflow = true }
pi_minus_pt = { range = [0.0, 500.0], bins = 100, overflow = true }
delta_r_pipi = { range = [0.0, 1.0], bins = 100, overflow = true }
delta_r_gamma_rho = { range = [0.0, 6.0], bins = 100, overflow = true }
rho_pt_over_photon_pt = { range = [0.0, 10.0], bins = 100, overflow = true }
reco_h_mass_minus_gen_h_mass = { range = [-1000.0, 1000.0], bins = 100, overflow = true }
reco_rho_mass_minus_gen_rho_recoil_mass = { range = [-10.0, 10.0], bins = 100, overflow = true }
delta_r_reco_rho_gen_rho_recoil = { range = [0.0, 6.0], bins = 100, overflow = true }

[plotting.profiles.physics_focus]
h_mass = { range = [80.0, 180.0], bins = 50, overflow = true }
rho_mass = { range = [0.30, 1.20], bins = 45, overflow = true }
photon_pt = { range = [0.0, 250.0], bins = 50, overflow = true }
rho_pt = { range = [0.0, 250.0], bins = 50, overflow = true }
h_pt = { range = [0.0, 300.0], bins = 60, overflow = true }
pi_plus_pt = { range = [0.0, 120.0], bins = 48, overflow = true }
pi_minus_pt = { range = [0.0, 120.0], bins = 48, overflow = true }
delta_r_pipi = { range = [0.0, 0.25], bins = 50, overflow = true }
delta_r_gamma_rho = { range = [0.0, 5.0], bins = 50, overflow = true }
rho_pt_over_photon_pt = { range = [0.0, 3.0], bins = 60, overflow = true }
reco_h_mass_minus_gen_h_mass = { range = [-100.0, 100.0], bins = 50, overflow = true }
reco_rho_mass_minus_gen_rho_recoil_mass = { range = [-2.0, 2.0], bins = 80, overflow = true }
delta_r_reco_rho_gen_rho_recoil = { range = [0.0, 5.0], bins = 50, overflow = true }

[plotting.profiles.signal_window]
h_mass = { range = [100.0, 160.0], bins = 60, overflow = true }
rho_mass = { range = [0.50, 1.05], bins = 55, overflow = true }
delta_r_pipi = { range = [0.0, 0.15], bins = 50, overflow = true }
rho_pt_over_photon_pt = { range = [0.4, 1.8], bins = 56, overflow = true }
reco_h_mass_minus_gen_h_mass = { range = [-50.0, 50.0], bins = 50, overflow = true }
