# Run-3 HToRhoGamma NanoAODv15 Branch Mapping
# This maps the analysis object aliases to actual offline NanoAOD branches in:
# /GluGluHtoRhoG_Par-M-125_TuneCP5_13p6TeV_powheg-pythia8-evtgen/RunIII2024Summer24NanoAODv15-150X_mcRun3_2024_realistic_v2-v2/NANOAODSIM

objects:
  Photon:
    count: nPhoton
    fields:
      pt: Photon_pt
      eta: Photon_eta
      phi: Photon_phi
      # Note: mass is assumed to be 0 as Photon_mass is absent

  ChargedCandidate:
    count: nPFCand
    fields:
      pt: PFCand_pt
      eta: PFCand_eta
      phi: PFCand_phi
      mass: PFCand_mass
      pdgId: PFCand_pdgId
      # Note: charge is inferred from pdgId
